server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve o backend em RUNTIME (DNS interno do Docker 127.0.0.11), senão o
    # nginx não inicia se o container backend ainda não estiver no DNS no startup.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $flow_backend "backend:8000";
        proxy_pass http://$flow_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
